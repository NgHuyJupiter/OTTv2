<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTTv2 - Rock Paper Scissors Chess</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/playfull.js@latest/dist/playfull.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-container">
    <h1>OTTv2 - Rock Paper Scissors Chess</h1>
    
    <div class="game-info">
      <div id="player-color">Waiting for opponent...</div>
      <div id="game-status">Connecting to server...</div>
      <div id="timer"></div>
    </div>
    
    <div class="board-container">
      <div class="board" id="board">
        <!-- 9x9 grid will be generated by JavaScript -->
      </div>
    </div>
    
    <div class="controls">
      <div class="piece-selection" id="piece-selection">
        <h3>Select Piece to Place:</h3>
        <button class="piece-btn rock" data-type="rock">Rock</button>
        <button class="piece-btn paper" data-type="paper">Paper</button>
        <button class="piece-btn scissors" data-type="scissors">Scissors</button>
      </div>
      
      <button id="ready-btn">Ready</button>
    </div>
  </div>
  
  <script src="game.js"></script>
</body>
</html>
